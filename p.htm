    <script type="text/javascript">
      // fun.js já foi revisto, falta este aquivo aqui. À medida em que for acertando, o correto é levar o código para lá.
      let matriz;
      let ordem = 'padrao';
      let prevordem;
      let dir = -1;
      let flag;
      let flag1;
      let flag2;
      let flag3;
      let flag4;
      let ctrl;
      let selts = new Set();
      let prv;
      let atimes = [];
      let adv = [];
      let max = 38;
      let max2 = 46;
      let rodadas = [];
      let rfixas;
      let xiao = undefined;
      let filtroAtivo = 'rods';   // 'rods', 'turns', ou 'dats'
      let filtroAnterior = 'rods';
      let ultimoTurno = '1';

      function rodaData(e) {
        e.preventDefault();
        // Como inputs nativos não expõem qual parte (dia/mês) está sob o mouse,
        // alteramos a data em +/- 1 dia, que é o comportamento padrão.
        let input = e.target;
        if (!input.value) return;

        let current = new Date(input.value + 'T12:00:00'); // T12 evita problemas de fuso horário mudando o dia
        let dir = e.deltaY < 0 ? 1 : -1;

        current.setDate(current.getDate() + dir);

        // Formata de volta para YYYY-MM-DD
        input.value = current.toISOString().split('T')[0];

        // Dispara a atualização
        getVals({target: input, type: 'input'});
      }

      // Limites globais
      // Limites e utilitários
      const MIN_YEAR = 2003;
      function pad(num, size) {
          var s = "0000" + num;
          return s.substr(s.length - size);
      }
      function getLastDay(mes, ano) {
        return new Date(ano, mes, 0).getDate();
      }

      // Função para manipular via rodinha/setas
      function manipulaData(el, delta) {
        let val = parseInt(el.value);
        // Se estiver vazio ou NaN, assume valor base
        if (isNaN(val)) {
           if (el.id.includes('_a')) val = MIN_YEAR;
           else val = 1;
        }

        val += delta;

        // Validação imediata apenas para Rodinha/Setas
        if (el.id.includes('_d')) {
          if (val < 1) val = 1;
          if (val > 31) val = 31;
        } else if (el.id.includes('_m')) {
          if (val < 1) val = 1;
          if (val > 12) val = 12;
        } else if (el.id.includes('_a')) {
          let maxY = new Date().getFullYear() + 1; // Usa o ano atual + 1 como limite
          if (val < MIN_YEAR) val = MIN_YEAR;
          if (val > maxY) val = maxY;
        }

        el.value = pad(val, el.id.includes('_a') ? 4 : 2);

        // Seleciona o texto novamente após alterar valor via teclado/mouse para manter UX
        if (el === document.activeElement)
          el.select();

        // Dispara atualização
        getVals({target: el, type: 'input_manual'});
      }

      function setupDateInputs() {
        const inputs = document.querySelectorAll('.dt-inp');

        inputs.forEach((inp, index) => {
          // 1. Auto-selecionar ao focar/clicar E salvar valor prévio
          inp.addEventListener('focus', function() {
            this.setAttribute('data-prv', this.value); // Salva o valor no foco
            this.select();
          });
          inp.addEventListener('click', function() { this.select(); });

          // 2. Rodinha do Mouse
          inp.addEventListener('wheel', function(e) {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 1 : -1;
            manipulaData(this, delta);
          });

          // 3. Teclado (Setas)
          inp.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowUp') {
              e.preventDefault();
              manipulaData(this, 1);
            } else if (e.key === 'ArrowDown') {
              e.preventDefault();
              manipulaData(this, -1);
            }  else if (e.key === 'ArrowLeft') {
              e.preventDefault();
              if (inputs[index - 1]) {
                  inputs[index - 1].focus();
              }
            } else if (e.key === 'ArrowRight') {
              e.preventDefault();
              if (inputs[index + 1]) {
                  inputs[index + 1].focus();
              }
            } else if (e.key === 'Enter') {
              this.blur(); // Força validação
            }
          });

          // 4. Digitação e Auto-Tab
          inp.addEventListener('input', function(e) {
            // Permite apenas números
            this.value = this.value.replace(/[^\d]/g, '');

            // Auto-Tab: Se preencheu o tamanho total, pula para o próximo
            if (this.value.length === this.maxLength) {
               // Encontra o próximo input dentro do container ou o primeiro do próximo container
               if (inputs[index + 1]) {
                   inputs[index + 1].focus();
               }
            }
          });

          // 5. Validação final e disparo (apenas no BLUR e SE HOUVE MUDANÇA)
          inp.addEventListener('blur', function(e) {
            let previousValue = this.getAttribute('data-prv'); // Pega o valor do foco
            let validatedValue = this.value; // Valor atual (pode estar incompleto)

            if (this.value !== '') {
               let val = parseInt(this.value);

               // Validação de limites
               if (this.id.includes('_d')) { if(val < 1) val = 1; if(val > 31) val = 31; }
               if (this.id.includes('_m')) { if(val < 1) val = 1; if(val > 12) val = 12; }
               if (this.id.includes('_a')) {
                  let maxY = new Date().getFullYear() + 1; // Usa o ano atual + 1 como limite
                  if (val < MIN_YEAR) val = MIN_YEAR;
                  if (val > maxY) val = maxY;
               }

               validatedValue = pad(val, this.id.includes('_a') ? 4 : 2);
               this.value = validatedValue;
            }

            // Só dispara getVals se o valor validado no final do blur
            // for DIFERENTE do valor que estava lá no início (no focus).
            if (validatedValue !== previousValue) {
               getVals(e);
            }
          });
        });
      }

      // Sincroniza Inputs com Anos (mantendo lógica da pandemia)
      function sincronizaDatasComAnos(iniAno, fimAno) {
        let diaIni = '01', mesIni = '01', anoIni = iniAno;
        let diaFim = '31', mesFim = '12', anoFim = fimAno;

        if (iniAno == 2021) { diaIni = '01'; mesIni = '03'; anoIni = 2021; }
        if (fimAno == 2020) { diaFim = '28'; mesFim = '02'; anoFim = 2021; }

        document.getElementById('di_d').value = diaIni;
        document.getElementById('di_m').value = mesIni;
        document.getElementById('di_a').value = anoIni;
        document.getElementById('df_d').value = diaFim;
        document.getElementById('df_m').value = mesFim;
        document.getElementById('df_a').value = anoFim;
      }

      function getVals (e) {
        let triggerId = e.target ? e.target.id : '';

        // --- UI Logic (Reset de filtros conflitantes) ---
        if (triggerId == 'mands' && frm.mando.value) {
          document.querySelector('input[name=mando]:checked').checked = false;
          document.getElementById('mands').style.color = 'gray';
        } else if (triggerId == 'tims') {
          atimes = [];
          while (document.getElementById('time').selectedOptions.length) document.getElementById('time').selectedOptions[0].selected = false;
          while (document.getElementById('grupos').selectedOptions.length) document.getElementById('grupos').selectedOptions[0].selected = false;
          document.getElementById('tims').style.color = 'gray';
        } else if (triggerId == 'advs'){
          adv = [];
          while(document.getElementById('timea').selectedOptions.length) document.getElementById('timea').selectedOptions[0].selected = false;
          while(document.getElementById('gruposa').selectedOptions.length) document.getElementById('gruposa').selectedOptions[0].selected = false;
          document.getElementById('advs').style.color = 'gray';
        }

        // 1. Identificar triggers
        let isDateTitleClick = (triggerId === 'dats');
        let isDateValueChange = e.target && e.target.classList.contains('dt-inp');

        let isTurnoRadioClick = (e.target && e.target.name == 'turno');
        let isTurnoTitleClick = (triggerId === 'turns');
        let isTurnoInput = isTurnoRadioClick || isTurnoTitleClick;

        let isRodadaInputClick = (triggerId == 'r1' || triggerId == 'r2' || triggerId == 'fixas');
        let isRodadaTitleClick = (e.type == 'click' && triggerId == 'rods');
        let isRodadaInput = isRodadaInputClick || isRodadaTitleClick;

        let isAnosInput = (triggerId === 'anoInicio' || triggerId === 'anoFinal' || triggerId === 'afix' || triggerId === 'anosTitle');

        // 2. Determinar o *próximo* estado do filtro
        let proximoFiltro = filtroAtivo; // Começa com o estado atual

        // --- Lógica de Toggles ---

        // FIX BUG 2: Clicou TÍTULO 'Turnos' (cinza) -> não faz NADA.
        if (isTurnoTitleClick && document.getElementById('turnos').style.color === 'gray') {
            isTurnoInput = false; // Cancela o evento, não muda de estado

        // --- Lógica de Ativação / Desativação (Toggle) ---

        // Clicou no TÍTULO "Datas" (para alternar)
        } else if (isDateTitleClick) {
            if (filtroAtivo === 'dats') { // Clicou em "Datas" (ativo)
                proximoFiltro = filtroAnterior; // Reverte
            } else {
                proximoFiltro = 'dats'; // Ativa
            }

        // Interagiu com um INPUT de data (seta, roda, digitação/blur)
        } else if (isDateValueChange) {
            // Apenas ATIVA o filtro de datas, NUNCA desativa
            if (filtroAtivo !== 'dats') {
                 proximoFiltro = 'dats';
            }
            // Se filtroAtivo já era 'dats', proximoFiltro continua 'dats' e nada muda.

        } else if (isRodadaInput) {
            // Se foi clique no TÍTULO e já estava ATIVO
            if (isRodadaTitleClick && filtroAtivo === 'rods') {
                proximoFiltro = filtroAnterior; // Reverte
            } else {
                proximoFiltro = 'rods'; // Ativa (ou re-ativa se mexeu em r1/r2)
            }

        } else if (isTurnoInput) { // (isTurnoInput só é true aqui se o FIX BUG 2 foi falso)
            // Se foi clique no TÍTULO e já estava ATIVO
            if (isTurnoTitleClick && filtroAtivo === 'turns') {
                proximoFiltro = filtroAnterior; // Reverte
            } else {
                proximoFiltro = 'turns'; // Ativa
            }

        } else if (isAnosInput) {
            // Mexeu nos sliders de ANO (afix, anoInicio, anoFinal)
            // Se 'Datas' estiver ativo, reverte para o filtro 'Anos' anterior ('rods' ou 'turns').
            if (filtroAtivo === 'dats') {
                proximoFiltro = filtroAnterior;
            }
            // Se já estava em 'rods' or 'turns', proximoFiltro = filtroAtivo (não muda).
        }

        // --- Lógica de Estado (Atualiza as variáveis globais) ---

        // Se o estado mudou, atualiza o "histórico"
        if (proximoFiltro !== filtroAtivo) {
            filtroAnterior = filtroAtivo;
            filtroAtivo = proximoFiltro;
        }

        // --- Lógica de Aplicação Visual (Aplica o estado) ---

        let radioTurno = document.querySelector('input[name=turno][value="' + ultimoTurno + '"]');
        let turnoEl = document.querySelector('input[name=turno]:checked');

        if (filtroAtivo === 'dats') {
            // ATIVANDO DATAS
            document.getElementById('turnos').style.color = 'gray';
            document.getElementById('rods').style.color = 'gray';
            document.getElementById('dats').style.color = 'black';
            document.getElementById('anosTitle').style.color = 'gray';
            if (turnoEl) { turnoEl.checked = false; }

        } else if (filtroAtivo === 'rods') {
            // ATIVANDO RODADAS
            document.getElementById('turnos').style.color = 'gray';
            document.getElementById('rods').style.color = 'black';
            document.getElementById('dats').style.color = 'gray';
            document.getElementById('anosTitle').style.color = 'black';
            if (turnoEl) { turnoEl.checked = false; }

        } else if (filtroAtivo === 'turns') {
            // ATIVANDO TURNOS
            document.getElementById('turnos').style.color = 'black';
            document.getElementById('rods').style.color = 'gray';
            document.getElementById('dats').style.color = 'gray';
            document.getElementById('anosTitle').style.color = 'black';
            // Garante que o rádio está marcado (caso tenha vindo de um toggle)
            if (radioTurno && !radioTurno.checked) {
                radioTurno.checked = true;
            }
        }

        // Validação de input numérico para rodadas
        if (e.type == 'input' && (triggerId == 'r1' || triggerId == 'r2')) {
           if(/[^\d]/.test(e.target.value)) e.target.value = prv; else prv = e.target.value;
        }

        // Sliders de Ano
        if ((e.type == 'change' && triggerId == 'anoInicio' && e.target.selectedIndex < document.getElementById('anoFinal').selectedIndex) || (e.type == 'change' && triggerId == 'anoFinal' && e.target.selectedIndex > document.getElementById('anoInicio').selectedIndex)) {
          var aux = document.getElementById('anoInicio').selectedIndex;
          document.getElementById('anoInicio').selectedIndex = document.getElementById('anoFinal').selectedIndex;
          document.getElementById('anoFinal').selectedIndex = aux;
        }

        clearTimeout(flag);

        // Selects
        if (atimes.length) document.getElementById('selects').innerHTML = '<option>' + atimes.sort().join('</option><option>') + '</option>';
        else document.getElementById('selects').innerHTML = '<option>&nbsp;</option>';
        if (adv.length) document.getElementById('selectsa').innerHTML = '<option>' + adv.sort().join('</option><option>') + '</option>';
        else document.getElementById('selectsa').innerHTML = '<option>&nbsp;</option>';

        let slide1 = parseInt(document.getElementById('anoInicio').value);
        let slide2 = parseInt(document.getElementById('anoFinal').value);
        if (slide1 > slide2) { var tmp = slide2; slide2 = slide; slide1; slide1 = tmp; }

        // --- Sincronia Automática ---
        if (triggerId === 'anoInicio' || triggerId === 'anoFinal' || triggerId === 'afix' || e.type === 'load') {
           sincronizaDatasComAnos(slide1, slide2);

           if (e.type === 'load') {
              // No carregamento inicial (load), força Anos/Rodadas ativos
              // Os valores visuais são definidos pela "Lógica de Aplicação Visual" acima
              // Apenas setamos o estado inicial das variáveis globais
              filtroAtivo = 'rods';
              filtroAnterior = 'rods';

              // Força a aplicação visual inicial
              document.getElementById('dats').style.color = 'gray';
              document.getElementById('rods').style.color = 'black';
              document.getElementById('turnos').style.color = 'gray';
              document.getElementById('anosTitle').style.color = 'black';
           }
        }

        // Lógica Rodadas
        var exmax = max; var exmax2 = max2;
        if (slide1 < 2005) max2 = 46; else if(slide1 == 2005) max2 = 42; else max2 = 38;
        if (rfixas) max = max2; else if (slide2 < 2005) max = 46; else if (slide2 == 2005) max = 42; else max = 38;
        if (rfixas && parseInt(document.getElementById('r1').value) > parseInt(document.getElementById('r2').value)) document.getElementById('r1').value = parseInt(document.getElementById('r2').value);
        else if (rfixas && parseInt(document.getElementById('r1').value) == parseInt(document.getElementById('r2').value) && parseInt(document.getElementById('r1').value) == exmax) document.getElementById('r1').value = max, document.getElementById('r2').value = max;
        if (parseInt(document.getElementById('r2').value) > max || document.getElementById('r2').value == exmax) document.getElementById('r2').value = max;
        rodadas = [Number(document.getElementById('r1').value), Number(document.getElementById('r2').value)];

        let finalDataIni = null;
        let finalDataFim = null;

        let di_d = parseInt(document.getElementById('di_d').value);
        let di_m = parseInt(document.getElementById('di_m').value);
        let di_a = parseInt(document.getElementById('di_a').value);
        let df_d = parseInt(document.getElementById('df_d').value);
        let df_m = parseInt(document.getElementById('df_m').value);
        let df_a = parseInt(document.getElementById('df_a').value);

        // Só aplicamos o filtro de data se ele estiver ativo (filtroAtivo)
        if (filtroAtivo === 'dats' && di_d && di_m && di_a && df_d && df_m && df_a) {

           // 1. Tratar dias inválidos para cálculo (ex: 31/02)
           let useDiaIni = Math.min(di_d, getLastDay(di_m, di_a));
           let useDiaFim = Math.min(df_d, getLastDay(df_m, df_a));

           // Objetos Date para comparação
           let objIni = new Date(di_a, di_m - 1, useDiaIni);
           let objFim = new Date(df_a, df_m - 1, useDiaFim);
           let maxY = new Date().getFullYear() + 5; // Usa um limite razoável

           // 2. Se Final < Inicial, incrementa APENAS o ano da final
           // Executamos apenas se não estiver digitando (input), mas no blur ou change manual
           if (e.type !== 'input' && objFim < objIni) {
              while (objFim < objIni && df_a < maxY) { // +5 segurança para loop infinito
                 df_a++;
                 // Recalcula o objeto com o novo ano (cuidado com 29/02 se mudar ano bissexto)
                 useDiaFim = Math.min(df_d, getLastDay(df_m, df_a));
                 objFim = new Date(df_a, df_m - 1, useDiaFim);
              }
              // Atualiza visualmente o input de ano final
              document.getElementById('df_a').value = df_a;
           }

           // Formatação final para o classificar (YYYY-MM-DD)
           finalDataIni = `${di_a}-${pad(di_m, 2)}-${pad(useDiaIni, 2)}`;
           finalDataFim = `${df_a}-${pad(df_m, 2)}-${pad(useDiaFim, 2)}`;

        } // Fim do if (filtroAtivo === 'dats')

        flag = setTimeout(function () {
          classificar({
            anos: slide1 + ':' + slide2,
            rodadas, rfixas, times: atimes, adv,
            dataInicio: finalDataIni,
            dataFinal: finalDataFim
          });
        }, 100);
      }

      function rodroda (e) {
        let este = this.id == 'r1' ? 0 : 1;
        var podecrescer = !rfixas ? 1 : este == 0 ? this.value < parseInt(document.getElementById('r2').value) : 1;
        var podereduzir = !rfixas ? 1 : este == 1 ? this.value > parseInt(document.getElementById('r1').value) : 1;

        if (e.type == 'wheel') {
          e.preventDefault();
          if (e.deltaY < 0) {
            if (this.value < (este == 0 ? max2 : max) && podecrescer) {
              this.value++;
              getVals(e);
            }
          } else if (this.value > 1 && podereduzir) {
            this.value--;
            getVals(e);
          }
        }  else if(e.type == 'keydown') {
          if (e.keyCode == 38) {
            if (this.value < (este == 0 ? max2 : max) && podecrescer) {
              this.value++;
              getVals(e);
            }
          } else if (e.keyCode == 40) {
            if (this.value > 1 && podereduzir) {
              this.value--;
              getVals(e);
            }
          } else if (window.getSelection().toString() == e.target.value) {
            window.getSelection().removeAllRanges()
          }
        }
      }

      function selec (e) {
        if (this.value.substring(this.selectionStart, this.selectionEnd) != '') {
          this.selectionStart=0;
          this.selectionEnd=0;
          flag1 = 1;
          flag2 = 1;
        } else {
          if (this.id == 'r1')
            flag1 = undefined;
          else
            flag2 = undefined;
        }
      }

      function turn (e) {
        ultimoTurno = e.target.value; // Salva o valor (1 ou 2)
        // As cores agora são gerenciadas inteiramente pela getVals
        getVals(e);

      function mand (e) {
        mando = document.querySelector('input[name=mando]:checked').value;
        document.getElementById('mands').style.color = 'black';
        getVals(e);

      function tim (e) {
        var gppos = document.getElementById('grupos').scrollTop;
        document.getElementById('tims').style.color = 'black';

        if (!flag3) {
          atimes = [];
          for (i of document.getElementById('time').selectedOptions)
            atimes.push(i.value);
        }  else {
          flag3 = false;
        }

        var i2 = 0;

        for (i in grp) {
          if (grp[i].every(elem => atimes.indexOf(elem) > -1)) {
            document.getElementById('grupos').options[i2].selected = true;
          } else {

          }
          i2++;
        }

        document.getElementById('grupos').scrollTop = gppos;

        if (atimes.length == 0)
          document.getElementById('tims').style.color='gray';

      }

      function grup (e) {
        var tmpos = document.getElementById('time').scrollTop;
        document.getElementById('tims').style.color = 'black';

        if (!ctrl)
          atimes = [];

        var seltsm = new Set();

        for (i of this.selectedOptions) {
          Array.prototype.push.apply(atimes, grp[i.value]);
          seltsm.add(i.value);
        }

        atimes = [...new Set(atimes)];//tira repetições

        if (selts.size) {
          for (i of selts) {
            if (!seltsm.has(i)) {
              for (var i3 = 0; i3 < grp[i].length; i3++) {
                if ((i4 = atimes.indexOf(grp[i][i3])) > -1) {
                  atimes.splice(i4,1);
                  i3--;
                }
              }
            }
          }
        }

        selts = new Set();
        var i2 = 0;

        for (i of ltimes) {
          if (atimes.indexOf(i) > -1)
            document.getElementById('time').options[i2].selected = true;
          else
            document.getElementById('time').options[i2].selected = false;
          i2++;
        }

        document.getElementById('time').scrollTop = tmpos;
        flag3 = true;

        getVals(e);
      }

      function grupc (e) {
        ctrl = e.ctrlKey;
        if (ctrl && e.type == 'mousedown') {
          for (i of this.selectedOptions)
            if (i.selected)

      function invert (e) {
        var tmpos = document.getElementById('time').scrollTop;
        atimes = [];
        for (i of document.getElementById('time').options) {
          i.selected = !i.selected;
          if (i.selected)
            atimes.push(i.value);
        }

        document.getElementById('time').scrollTop = tmpos;
        flag3 = true;
        tim(e);

      function tima (e) {

          adv = [];
          for (i of document.getElementById('timea').selectedOptions)

        if (adv.length == 0) {
          adv = [];
          document.getElementById('advs').style.color='gray';

      function grupa (e) {

        document.getElementById('advs').style.color = 'black';

        if (!ctrl)
          adv = [];

        var seltsm = new Set();

        for (i of this.selectedOptions) {
          Array.prototype.push.apply(adv, grp[i.value]);
          seltsm.add(i.value);
        }

        adv = [...new Set(adv)];//tira repetições

        if (selts.size) {
          for (i of selts) {
            if (!seltsm.has(i)) {
              for (var i3 = 0; i3 < grp[i].length; i3++) {
                if ((i4 = adv.indexOf(grp[i][i3])) > -1) {
                  adv.splice(i4,1);
                  i3--;
                }
              }
            }
          }
        }

        selts = new Set();
        var i2 = 0;

        for (i of ltimes) {
          if (adv.indexOf(i) > -1)
            document.getElementById('timea').options[i2].selected = true;
          else
            document.getElementById('timea').options[i2].selected = false;
          i2++;
        }

        document.getElementById('timea').scrollTop = tmpos;
        flag4 = true;
        tima(e);
        getVals(e);
      }

      function inverta (e) {
        var tmpos = document.getElementById('timea').scrollTop;
        adv = [];

        for (i of document.getElementById('timea').options) {
          i.selected = !i.selected;

          if (i.selected)
            adv.push(i.value);
        }

        document.getElementById('timea').scrollTop = tmpos;
        flag4 = true;
        tima(e);
        getVals(e);
      }

      function merge () {
        if (typeof xiao == 'undefined') {
          xiao = matriz;
        } else {
          var flag = [];
          xiao.forEach ( function (w) {
            for (var z in matriz) {
              if (w.n == matriz[z].n) {
                w.p += matriz[z].p;
                w.j += matriz[z].j;
                w.v += matriz[z].v;
                w.e += matriz[z].e;
                w.d += matriz[z].d;
                w.gm += matriz[z].gm;
                w.gs += matriz[z].gs;
                w.s += matriz[z].s;
                flag[z] = 1;
                break;
              }
            }
          });

          for (var n = 0; n < matriz.length; n++) {
            if (!flag[n])
              xiao.push({n:matriz[n].n,p:matriz[n].p,j:matriz[n].j,v:matriz[n].v,e:matriz[n].e,d:matriz[n].d,gm:matriz[n].gm,gs:matriz[n].gs,s:matriz[n].s});
          }
        }
      }

      function subtr () {
        if (typeof xiao != 'undefined') {
          l1: for(var n = xiao.length - 1; n > -1; n--) {
            for (var z in matriz) {
              if (xiao[n].n == matriz[z].n) {
                xiao[n].j -= matriz[z].j;
                if(xiao[n].j == 0 && 0 /*desativando esse if porque quero comparar diferencial de turno e returno, o que daria jogo = 0 e portanto removeria time da classificacao*/) {
                  xiao.splice(n, 1);
                  continue l1;
                } else {
                  xiao[n].p -= matriz[z].p;
                  xiao[n].v -= matriz[z].v;
                  xiao[n].e -= matriz[z].e;
                  xiao[n].d -= matriz[z].d;
                  xiao[n].gm -= matriz[z].gm;
                  xiao[n].gs -= matriz[z].gs;
                  xiao[n].s -= matriz[z].s;
                  continue l1;
                }
              }
            }
          }//);
        }
      }

      function oncg (e) {
        const dir = e.deltaY > 0 ? 1 : -1;

        if (e.target.selectedIndex + dir < e.target.length && e.target.selectedIndex + dir >= 0 && ((e.target.id == 'anoInicio' && e.target.selectedIndex + dir >= document.getElementById('anoFinal').selectedIndex) || (e.target.id == 'anoFinal' && e.target.selectedIndex + dir <= document.getElementById('anoInicio').selectedIndex)))
          e.target.selectedIndex += dir;
        e.preventDefault();
        getVals(e);
      }

      function af (e) {
        const dir = e.deltaY > 0 ? 1 : -1;

        if (document.getElementById('anoInicio').selectedIndex != document.getElementById('anoFinal').selectedIndex) {
          if (dir === -1)
            document.getElementById('anoInicio').selectedIndex = document.getElementById('anoFinal').selectedIndex;
          else
            document.getElementById('anoFinal').selectedIndex = document.getElementById('anoInicio').selectedIndex;
        }

        if(document.getElementById('anoInicio').selectedIndex + dir < document.getElementById('anoInicio').length && document.getElementById('anoInicio').selectedIndex + dir >= 0) {
          document.getElementById('anoInicio').selectedIndex += dir;
          document.getElementById('anoFinal').selectedIndex += dir;
        }

        e.preventDefault();
        getVals(e);
      }

          for (var n = 0; n < tabela.tBodies[0].rows.length; n++) {
            tabela.tBodies[0].rows[n].cells[1].style.backgroundColor = '';
          }
        });

        setupDateInputs(); // Inicializa listeners dos inputs de data

        document.getElementById('anoInicio').focus();
        // Força carga inicial para sincronizar datas
        getVals({type: 'load'});
      }

      function tsort (el) {
        for (a of tabela.tHead.children[0].children) {
          if (a.innerHTML.match(/↑|↓/)) {
            a.innerHTML = a.innerHTML.slice(0,-1);
            break;
          }
        }

        if (el.innerHTML != '#' || dir != -1)
          el.innerHTML += seta[dir];
      }
